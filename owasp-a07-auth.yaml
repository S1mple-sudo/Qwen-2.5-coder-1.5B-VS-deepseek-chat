rules:
  - id: python.security.auth.plaintext-password-compare
    languages: [python]
    severity: ERROR
    message: >
      使用 == 直接比较明文密码，既不安全也易受时序攻击。
      应使用常量时间比较（hmac.compare_digest），且密码必须存储哈希而非明文。
    patterns:
      - pattern-either:
          - pattern: $PASSWORD == $SUBMITTED
          - pattern: $SUBMITTED == $PASSWORD
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: (?i)(password|passwd|pwd|secret|token|pin|credential)
    metadata:
      cwe: "CWE-287: Improper Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: MEDIUM

  - id: python.security.auth.weak-password-hash
    languages: [python]
    severity: ERROR
    message: >
      使用 MD5/SHA-1 等弱哈希存储密码。
      应使用带盐的慢哈希算法，如 bcrypt / argon2 / scrypt / PBKDF2。
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($PASSWORD)
          - pattern: hashlib.sha1($PASSWORD)
    metadata:
      cwe: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH

  - id: python.security.auth.hardcoded-credential
    languages: [python]
    severity: ERROR
    message: >
      在源码中硬编码了账号口令，存在凭证泄露风险。
    patterns:
      - pattern-either:
          - pattern: username = "..."
          - pattern: USERNAME = "..."
          - pattern: $DB.connect($HOST, $USER, "...")
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: LOW
